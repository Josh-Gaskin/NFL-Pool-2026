name: Sync NFL scores

on:
  schedule:
    # 9am UTC, every day except Tuesday (day 2) — a safe buffer after the
    # latest games finish, on every day NFL games are ever actually played.
    - cron: "0 9 * * 0,1,3,4,5,6"
  workflow_dispatch: {}   # lets you trigger a sync manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
name: Sync NFL scores

on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
